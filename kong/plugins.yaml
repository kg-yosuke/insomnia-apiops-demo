# Gateway policies added on top of the OpenAPI-generated config.
_format_version: "1.0"
add-plugins:
  - selectors:
      - $..services[*]
    overwrite: false
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true
